<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Notebook spine -->
  <rect x="8" y="6" width="10" height="52" rx="4" fill="#1757ac"/>
  <!-- Notebook cover -->
  <rect x="14" y="6" width="38" height="52" rx="6" fill="#257de0"/>
  <!-- Page edge -->
  <rect x="44" y="11" width="5" height="42" rx="2.5" fill="#f4f8ff"/>
  <!-- Ruled lines -->
  <rect x="22" y="20" width="20" height="3.6" rx="1.8" fill="#eaf2ff"/>
  <rect x="22" y="29" width="20" height="3.6" rx="1.8" fill="#eaf2ff"/>
  <rect x="22" y="38" width="14" height="3.6" rx="1.8" fill="#eaf2ff"/>
  <!-- Coin badge -->
  <circle cx="45" cy="47" r="15" fill="#f47230" stroke="#ffffff" stroke-width="3.5"/>
  <text x="45" y="53" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">$</text>
</svg>
